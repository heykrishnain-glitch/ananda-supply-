<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0A5C8F"><style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style><title>Supply Khata</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Hind:wght@400;500;600&display=swap">
<style>
/* Layout: khata-book ledger. Blue ink for the app, green for supply given, amber for demand asked. Mobile-first, bottom tab bar, photo-tile product picker. */
:root{
  --bg:#F2F5F7; --surface:#FFFFFF; --ink:#12212B; --muted:#586B78; --line:#D6DFE5;
  --accent:#0A5C8F; --accent-ink:#FFFFFF; --accent-soft:#E0EEF7;
  --supply:#17744A; --supply-soft:#DDF1E6; --on-supply:#FFFFFF;
  --demand:#9A5000; --demand-soft:#FAEAD3; --on-demand:#FFFFFF;
  --danger:#B3261E; --danger-soft:#FBE3E0;
  --font-display:'Baloo 2','Hind',system-ui,sans-serif;
  --font-body:'Hind',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1820; --surface:#16242E; --ink:#E7EEF2; --muted:#93A5B1; --line:#2A3C48;
    --accent:#5BB4EA; --accent-ink:#06202F; --accent-soft:#1A3F57;
    --supply:#5FCB8F; --supply-soft:#123A27; --on-supply:#052A1A;
    --demand:#F0A64E; --demand-soft:#43300F; --on-demand:#2B1A00;
    --danger:#FF8A80; --danger-soft:#4A1E1B; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1820; --surface:#16242E; --ink:#E7EEF2; --muted:#93A5B1; --line:#2A3C48;
  --accent:#5BB4EA; --accent-ink:#06202F; --accent-soft:#1A3F57;
  --supply:#5FCB8F; --supply-soft:#123A27; --on-supply:#052A1A;
  --demand:#F0A64E; --demand-soft:#43300F; --on-demand:#2B1A00;
  --danger:#FF8A80; --danger-soft:#4A1E1B; color-scheme:dark;
}
*{box-sizing:border-box}
body{font:16px/1.45 var(--font-body);background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 120px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0 10px;border-bottom:1px solid var(--line);margin-bottom:14px}
.brand{font:800 22px/1.15 var(--font-display)}
.sub{color:var(--muted);font-size:13px}
.tools{display:flex;align-items:center;gap:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:5px 11px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
h1{font:800 24px/1.2 var(--font-display);margin:0 0 8px;text-wrap:balance}
h2{font:600 17px/1.2 var(--font-display);margin:22px 0 10px;text-wrap:balance}
h3{font:600 13px/1.2 var(--font-body);margin:16px 0 8px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
p{margin:0}
.muted{color:var(--muted)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:18px 16px;color:var(--muted)}
.empty b{color:var(--ink);display:block;margin-bottom:2px}

/* buttons */
.btn{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-weight:600;cursor:pointer;line-height:1.2}
.btn.sm{padding:7px 11px;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.supply{background:var(--supply);border-color:var(--supply);color:var(--on-supply)}
.btn.demand-btn{background:var(--demand);border-color:var(--demand);color:var(--on-demand)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn.wide{width:100%;padding:13px 14px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.acts.big .btn{flex:1 1 140px}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:none;text-align:left}
.back{background:none;border:0;padding:4px 0 10px;color:var(--accent);font-weight:600;cursor:pointer}

/* product thumbnails */
.th{display:inline-grid;place-items:center;width:44px;height:44px;flex:none;border-radius:10px;background:var(--accent-soft);overflow:hidden}
.th svg,.th img{width:100%;height:100%;display:block}
.th svg{padding:3px}
.th img{object-fit:cover}
.th.sm{width:30px;height:30px;border-radius:8px}
.th.sm svg{padding:2px}
.th.lg{width:72px;height:72px;border-radius:14px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:2px;min-width:0}
.stat span{font-size:13px;color:var(--muted)}
.stat b{font:800 22px/1.2 var(--font-display);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat small{font-size:12px;color:var(--muted)}
.stat.demand b{color:var(--demand)}
.stat.supply b{color:var(--supply)}

/* ledger rows */
.rows{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:12px 14px;cursor:pointer}
.row:first-child{border-top:0}
.row-main{display:grid;gap:1px;min-width:0}
.row-main b{font-weight:600}
.row-main span{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.row-side{display:grid;justify-items:end;gap:4px;text-align:right}
.row-side b{font-variant-numeric:tabular-nums}

/* product tiles */
.grp{margin:16px 0 8px;font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.grp:first-child{margin-top:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.tile{position:relative;display:grid;justify-items:center;align-content:start;gap:6px;padding:10px 6px 8px;border:1px solid var(--line);background:var(--surface);border-radius:12px;cursor:pointer;text-align:center;min-width:0}
.tile.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.tn{font-size:13px;line-height:1.25;font-weight:500;overflow-wrap:anywhere}
.ts{font-size:12px;color:var(--muted);margin-top:-3px}
.badge{position:absolute;top:6px;right:6px;background:var(--accent);color:var(--accent-ink);font:600 12px/1 var(--font-body);font-style:normal;padding:4px 7px;border-radius:999px}

/* entry cards */
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.item-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.item-h .link{font-size:17px}
.meta{font-size:13px;color:var(--muted)}
.items{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:2px}
.items li{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:10px;padding:5px 0;border-top:1px dotted var(--line)}
.items li:first-child{border-top:0}
.items b{font-variant-numeric:tabular-nums;font-weight:600}
.items em{font-style:normal;color:var(--supply);font-variant-numeric:tabular-nums;min-width:60px;text-align:right}
.remark{margin-top:10px;padding:8px 10px;background:var(--demand-soft);border-radius:8px;font-size:15px}
.note{margin-top:8px;font-size:14px;color:var(--muted)}
.total{display:flex;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-weight:600}
.total span:last-child{font-variant-numeric:tabular-nums;color:var(--supply)}

/* pills */
.pill{display:inline-block;font:600 12px/1.5 var(--font-body);padding:1px 9px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--supply-soft);color:var(--supply)}
.pill.due{background:var(--demand-soft);color:var(--demand)}
.pill.late{background:var(--danger-soft);color:var(--danger)}
.pill.soon{background:var(--accent-soft);color:var(--accent)}
.pill.warn{background:var(--demand-soft);color:var(--demand)}

/* chips / search / month bar */
.search{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-bottom:10px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.monthbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0 12px}
.monthbar b{font:600 17px var(--font-display)}
.topline{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}

/* shop card */
.shopcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.kv{display:grid;gap:6px;margin:0}
.kv div{display:grid;grid-template-columns:76px 1fr;gap:8px}
.kv dt{color:var(--muted);font-size:14px}
.kv dd{margin:0;overflow-wrap:anywhere}
.sel{user-select:all}

/* tables */
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:9px 12px;text-align:left;border-top:1px solid var(--line);vertical-align:top}
thead th{border-top:0;font-size:12.5px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tfoot td{font-weight:700;background:var(--bg)}

/* nav */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.nb{background:none;border:0;padding:8px 2px 7px;display:grid;justify-items:center;gap:2px;color:var(--muted);font:600 11.5px var(--font-body);cursor:pointer}
.nb svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nb[aria-current="page"]{color:var(--accent)}

/* sheets */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(8,18,26,.55);display:flex;align-items:flex-end;justify-content:center}
#picker{z-index:55}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92%;overflow-y:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet.tall{height:92%;display:flex;flex-direction:column;overflow:hidden}
.sheet h2{margin-top:0}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.ph h2{margin:0}
#pgrid{overflow-y:auto;flex:1;min-height:0;padding-bottom:8px}
.field{display:grid;gap:4px;margin-bottom:12px}
.field>span{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.photo{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.photo .acts{margin-top:6px}
.photo p{font-size:13px;color:var(--muted)}
.irow{display:grid;gap:10px;margin-bottom:10px;padding:10px;border:1px solid var(--line);border-radius:12px;min-width:0}
.ir-top{display:flex;align-items:center;gap:10px}
.ir-name{flex:1;min-width:0;display:grid}
.ir-name b{font-weight:600;overflow-wrap:anywhere}
.ir-name span{color:var(--muted);font-size:13px}
.ir-bot{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
.stepper button{width:44px;height:44px;border:0;background:none;font-size:22px;line-height:1;cursor:pointer;color:var(--accent)}
.irow .stepper input{width:64px;height:44px;text-align:center;border:0;background:transparent;font-weight:600;font-size:17px;padding:0;-moz-appearance:textfield}
.irow .stepper input::-webkit-outer-spin-button,.irow .stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.rate{display:flex;align-items:center;gap:6px;flex:1 1 120px;min-width:0;color:var(--muted)}
.rate input{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.x{background:none;border:0;font-size:24px;line-height:1;color:var(--muted);cursor:pointer;padding:2px 8px}
.hint{padding:14px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);font-size:14px;margin-bottom:10px}
.sheet .acts{margin-top:14px;justify-content:flex-end}
.sheet .tot{display:flex;justify-content:space-between;margin:10px 0 0;font-weight:600}
#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);text-align:center}
.banner{background:var(--demand-soft);color:var(--demand);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}
.stk{display:flex;align-items:center;gap:10px;padding:9px 12px;border-top:1px solid var(--line)}
.stk:first-child{border-top:0}
.stk .ir-name{flex:1;min-width:0}
.s-in{width:92px;flex:none;padding:10px;text-align:center;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-weight:600;font-size:17px;font-variant-numeric:tabular-nums}
.s-in.zero{border-color:var(--danger);color:var(--danger)}
.s-in.has{border-color:var(--supply)}
.datebar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.datebar input{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);text-align:center;font-weight:600}
.sbar{position:sticky;bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:5;margin-top:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 2px 10px rgba(8,18,26,.14)}
.sbar span{font-size:14px;color:var(--muted)}
.linkcard{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:12px;cursor:pointer}
.linkcard b{display:block}
.linkcard span{color:var(--muted);font-size:14px}
@media (max-width:420px){.two{grid-template-columns:1fr}.brand{font-size:20px}.nb{font-size:10.5px}}
</style>

</head><body><main class="wrap">

</main>
<nav id="nav"></nav>

var $=function(s){return document.querySelector(s);};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
var pad=function(n){return String(n).padStart(2,'0');};
var ymd=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
var today=function(){return ymd(new Date());};
var addDays=function(s,n){var d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return ymd(d);};
var ym=function(s){return String(s||'').slice(0,7);};
var shiftMonth=function(m,n){var p=m.split('-').map(Number);var d=new Date(p[0],p[1]-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1);};
var loc=function(){return lang==='hi'?'hi-IN':'en-IN';};
var fmtD=function(s){return new Date(s+'T00:00:00').toLocaleDateString(loc(),{weekday:'short',day:'numeric',month:'short'});};
var fmtM=function(m){return new Date(m+'-01T00:00:00').toLocaleDateString(loc(),{month:'long',year:'numeric'});};
var num=function(n){return (Math.round((+n||0)*100)/100).toLocaleString('en-IN');};
var inr=function(n){return '₹'+num(n);};
var uid=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);};
var without=function(o){var r={};Object.keys(o).forEach(function(k){if(k!=='id')r[k]=o[k];});return r;};
var byName=function(a,b){return String(a.name||'').localeCompare(String(b.name||''),'en',{sensitivity:'base'});};
var lineAmt=function(i){return (+i.qty||0)*(+i.rate||0);};
var supTotal=function(s){return (s.items||[]).reduce(function(a,i){return a+lineAmt(i);},0);};
var sum=function(list){return list.reduce(function(a,s){return a+supTotal(s);},0);};

function lsLoad(){try{var j=JSON.parse(localStorage.getItem(LS)||'null');if(j)COLS.forEach(function(c){S[c]=j[c]||[];});}catch(e){}}

var chain=Promise.resolve();
function onWriteErr(e){
  var c=e&&e.code;
  toast(c==='quota_exceeded'?t('err.quota'):c==='invalid_argument'?t('err.perm'):t('err.save'));
}
function save(col,id,data){
  if(mode==='local'){
    var i=S[col].findIndex(function(x){return x.id===id;});
    var row=Object.assign({},data,{id:id});
    if(i>=0)S[col][i]=row;else S[col].push(row);
    lsSave();render();return Promise.resolve(true);
  }
  var p=chain.then(function(){return db.collection(col).doc(id).set(data);});
  chain=p.catch(function(){});
  return p.then(function(){return true;},function(e){onWriteErr(e);return false;});
}
function remove(col,id){
  if(mode==='local'){S[col]=S[col].filter(function(x){return x.id!==id;});lsSave();render();return Promise.resolve(true);}
  var p=chain.then(function(){return db.collection(col).doc(id).delete();});
  chain=p.catch(function(){});
  return p.then(function(){return true;},function(e){onWriteErr(e);return false;});
}
var isLoading=function(){return mode==='boot'||(mode==='cloud'&&!COLS.every(function(c){return ready[c];}));};

/* ---------- lookups ---------- */
var shopOf=function(id){return S.shops.find(function(s){return s.id===id;});};
var prodOf=function(id){return S.products.find(function(p){return p.id===id;});};
var shopName=function(id){var s=shopOf(id);return s?s.name:t('delShopName');};

function productTotals(sups){
  var m={};
  sups.forEach(function(s){(s.items||[]).forEach(function(i){
    var k=i.name+'|'+(i.unit||'');
    if(!m[k])m[k]={name:i.name,unit:i.unit||'',qty:0,amt:0};
    m[k].qty+=+i.qty||0;m[k].amt+=lineAmt(i);
  });});
  return Object.keys(m).map(function(k){return m[k];}).sort(byName);
}

var GROUP_HUE={'Paneer':42,'Rabdi':25,'Dahi':210,'Chaach':150,'Lassi':330,'Tofu':90,'Milk (Pouch)':205,'Ghee':38,'Butter':50,'Flavoured Milk':340,'Cream':270,'Sweets':20,'Oil':58,'Milk (Tetra)':222,'Paneer Spread':8,'Milkshake':300,'Pure Power':130,'Badam Milk Can':30,'Soya Chaap':15};
var GROUP_SHAPE={'Paneer':'block','Rabdi':'cup','Dahi':'cup','Chaach':'bottle','Lassi':'glass','Tofu':'block','Milk (Pouch)':'pouch','Ghee':'jar','Butter':'block','Flavoured Milk':'bottle','Cream':'tub','Sweets':'sweets','Oil':'bottle','Milk (Tetra)':'carton','Paneer Spread':'jar','Milkshake':'bottle','Pure Power':'can','Badam Milk Can':'can','Soya Chaap':'bag'};
function nameHash(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h;}
function hueOf(p){var h=nameHash(p.name||'');var b=GROUP_HUE[p.group];return b==null?h%360:(b+(h%41)-20+360)%360;}
function shapeOf(p){
  var s=GROUP_SHAPE[p.group];if(s)return s;
  var n=p.name||'';
  if(/water/i.test(n))return 'bottle';
  if(/batter|bhurji/i.test(n))return 'tub';
  if(/tin /i.test(n+' '))return 'can';
  return 'bag';

function tile(p,n,act,sub){
  return '<button type="button" class="tile'+(n?' on':'')+'" data-act="'+act+'" data-id="'+p.id+'">'+thumb(p,'lg')+'<span class="tn">'+esc(p.name)+'</span>'+(sub?'<span class="ts">'+sub+'</span>':'')+(n?'<i class="badge">'+num(n)+'</i>':'')+'</button>';

function groupedTiles(list,tileFn){
  var groups={},h='';
  list.forEach(function(p){var k=(CATS.indexOf(p.cat)>=0?p.cat:'Other')+' · '+(p.group||'Others');(groups[k]=groups[k]||[]).push(p);});
  var order=CATS.concat(['Other']);
  Object.keys(groups).sort(function(a,b){var ca=order.indexOf(a.split(' · ')[0]),cb=order.indexOf(b.split(' · ')[0]);return ca-cb||a.localeCompare(b);}).forEach(function(k){
    h+='<div class="grp">'+esc(k)+'</div><div class="grid">'+groups[k].sort(byName).map(tileFn).join('')+'</div>';
  });
  return h;
}

/* ---------- stock: "how many are left at home" for a chosen day ---------- */
function stockDoc(d){return S.stocks.find(function(x){return x.id===d;});}
function savedVals(d){var doc=stockDoc(d),o={};if(doc)Object.keys(doc.items||{}).forEach(function(k){o[k]=String(doc.items[k].qty);});return o;}
function curVals(){return stockDirty?stockVals:savedVals(stockDate);}
function ensureVals(){if(!stockDirty)stockVals=savedVals(stockDate);}
function lastStockBefore(d){return S.stocks.filter(function(x){return x.id<d&&x.items&&Object.keys(x.items).length;}).sort(function(a,b){return b.id.localeCompare(a.id);})[0];}
function stockStats(vals){
  var ent=Object.keys(vals).filter(function(p){return vals[p]!==''&&!isNaN(parseFloat(vals[p]));});
  return {ent:ent,n:ent.length,zero:ent.filter(function(p){return parseFloat(vals[p])===0;}).length,total:ent.reduce(function(a,p){return a+parseFloat(vals[p]);},0)};
}

  var list=S.products.filter(function(p){return (scat==='all'||p.cat===scat)&&(!k||(p.name+' '+(p.group||'')).toLowerCase().indexOf(k)>=0)&&(!sonly||st.ent.indexOf(p.id)>=0);});
  var prev=lastStockBefore(stockDate);

/* ---------- photos ---------- */
function shrink(file){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file),img=new Image();
    img.onload=function(){
      var sc=Math.min(1,640/Math.max(img.width,img.height)),c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(img.width*sc));c.height=Math.max(1,Math.round(img.height*sc));
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
      c.toBlob(function(b){b?res(b):rej(new Error('blob'));},'image/jpeg',0.82);
    };
    img.onerror=function(){URL.revokeObjectURL(url);rej(new Error('img'));};
    img.src=url;
  });
}

}
async function deleteShop(id){
  var sup=S.supplies.filter(function(x){return x.shopId===id;}),dem=S.demands.filter(function(x){return x.shopId===id;});
  for(var i=0;i<sup.length;i++)if(!(await remove('supplies',sup[i].id)))return;
  for(var j=0;j<dem.length;j++)if(!(await remove('demands',dem[j].id)))return;
  if(await remove('shops',id)){view={name:'shops'};render();toast(t('toast.shopDel'));}
}
function csvCell(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function exportCsv(){
  var rows=[['Date','Shop','Owner','Phone','Product','Qty','Unit','Rate','Amount','Note']];
  S.supplies.filter(function(s){return ym(s.date)===month;}).sort(function(a,b){return a.date.localeCompare(b.date);}).forEach(function(s){
    var sh=shopOf(s.shopId)||{};
    (s.items||[]).forEach(function(i){rows.push([s.date,sh.name||'',sh.owner||'',sh.phone||'',i.name,i.qty,i.unit||'',i.rate||'',lineAmt(i)||'',s.note||'']);});
  });
  var csv='﻿'+rows.map(function(r){return r.map(csvCell).join(',');}).join('\n');
  dl.save({filename:'supply-'+month+'.csv',data:csv}).then(function(){toast(t('csv.ok'));},function(e){if(!e||e.code!=='declined')toast(t('csv.fail'));});
}

document.addEventListener('click',function(e){
  var el=e.target;
  if(el.id==='picker'){closePicker();return;}
  if(el.id==='sheet'){closeSheet();return;}
  var b=el.closest('[data-act]');if(!b)return;
  var a=b.dataset.act,id=b.dataset.id,td=today();
  switch(a){
    case 'lang':lang=b.dataset.l;try{localStorage.setItem('sk-lang',lang);}catch(x){}render();break;
    case 'go':view={name:b.dataset.v};q='';window.scrollTo(0,0);render();break;
    case 'open-shop':view={name:'shop',shopId:id};window.scrollTo(0,0);render();break;
    case 'month':month=shiftMonth(month,+b.dataset.n);render();break;
    case 'dfilter':dfilter=b.dataset.f;render();break;
    case 'scat':scat=b.dataset.c;render();break;
    case 'sonly':sonly=!sonly;render();break;
    case 'stock-day':setStockDate(addDays(stockDate,+b.dataset.n));break;
    case 'stock-save':saveStock();break;
    case 'stock-copy':{
      var pv=lastStockBefore(stockDate);if(!pv)break;
      var base=Object.assign({},curVals());
      Object.keys(pv.items).forEach(function(kk){if(base[kk]===undefined||base[kk]==='')base[kk]=String(pv.items[kk].qty);});
      stockVals=base;stockDirty=true;render();toast(t('stock.copied'));break;}
    case 'pcat':pcat=b.dataset.c;render();break;
    case 'csv':exportCsv();break;
    case 'add-catalog':addCatalog();break;
    case 'new-shop':openSheet('shop',{});break;
    case 'edit-shop':openSheet('shop',Object.assign({},shopOf(id)));break;
    case 'del-shop':confirmThen(t('c.shop'),function(){deleteShop(id);});break;
    case 'new-product':openSheet('product',{});break;
    case 'edit-product':openSheet('product',Object.assign({},prodOf(id)));break;
    case 'del-product':confirmThen(t('c.prod'),function(){remove('products',id).then(function(ok){if(ok){closeSheet();toast(t('toast.prodDel'));}});});break;
    case 'pick-photo':$('#f-photo').click();break;
    case 'del-photo':sheet.data.imgId='';refreshPhoto();break;
    case 'new-supply':
      if(!S.shops.length){toast(t('toast.firstShop'));openSheet('shop',{});break;}
      openSheet('supply',{shopId:b.dataset.shop||'',date:td,items:[]});break;
    case 'edit-supply':openSheet('supply',Object.assign({},S.supplies.find(function(x){return x.id===id;})));break;
    case 'del-supply':confirmThen(t('c.supply'),function(){remove('supplies',id).then(function(ok){if(ok){closeSheet();toast(t('toast.supplyDel'));}});});break;
    case 'new-demand':
      if(!S.shops.length){toast(t('toast.firstShop'));openSheet('shop',{});break;}
      openSheet('demand',{shopId:b.dataset.shop||'',askedOn:td,forDate:addDays(td,1),items:[]});break;
    case 'edit-demand':openSheet('demand',Object.assign({},S.demands.find(function(x){return x.id===id;})));break;
    case 'del-demand':confirmThen(t('c.demand'),function(){remove('demands',id).then(function(ok){if(ok){closeSheet();toast(t('toast.demandDel'));}});});break;
    case 'deliver':{
      var d=S.demands.find(function(x){return x.id===id;});if(!d)break;
      openSheet('supply',{shopId:d.shopId,date:td,demandId:d.id,note:d.remark||'',items:(d.items||[]).map(function(i){var p=prodOf(i.pid);return {pid:i.pid,name:i.name,unit:i.unit,qty:i.qty,rate:p&&p.rate>0?p.rate:0};})});break;}
    case 'close':closeSheet();break;
    case 'open-picker':openPicker(!!b.dataset.rate);break;
    case 'picker-done':closePicker();break;
    case 'picker-cat':picker.cat=b.dataset.c;renderPickerChips();renderPickerGrid();break;
    case 'pick':addItem(id);break;
    case 'qty-dec':stepQty(b,-1);break;
    case 'qty-inc':stepQty(b,1);break;
    case 'del-row':b.closest('.irow').remove();syncRows();calc();break;
    case 'save-shop':saveShop();break;
    case 'save-product':saveProduct();break;
    case 'save-supply':saveSupply();break;
    case 'save-demand':saveDemand();break;
    case 'confirm-yes':{var fn=sheet&&sheet.yes;closeSheet();if(fn)fn();break;}
  }
});
document.addEventListener('change',function(e){
  var el=e.target;
  if(el.id==='f-photo'){onPhoto(el.files&&el.files[0]);el.value='';}
  if(el.id==='s-date')setStockDate(el.value);
});
document.addEventListener('input',function(e){
  var el=e.target;
  if(el.classList&&el.classList.contains('s-in')){
    ensureVals();stockVals[el.dataset.pid]=el.value;stockDirty=true;updateSbar();
    el.className='s-in'+(el.value===''?'':(parseFloat(el.value)===0?' zero':' has'));return;
  }
  if(el.id==='pq'){picker.q=el.value;renderPickerGrid();return;}
  if(el.id==='q'){q=el.value;render();return;}
  if(el.closest&&el.closest('#sheet'))calc();
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){if(picker)closePicker();else if(sheet)closeSheet();}});

/* ---------- start ---------- */
async function init(){
  render();
  try{
    if(window.claude&&window.claude.use){
      db=await window.claude.use('db');
      try{dl=await window.claude.use('downloads');}catch(e){}
      try{assets=await window.claude.use('assets');}catch(e){}
    }
  }catch(e){}
  if(db){
    mode='cloud';
    COLS.forEach(function(c){
      db.collection(c).onSnapshot(function(snap){
        S[c]=snap.docs.map(function(d){return Object.assign({},d.data(),{id:d.id});});
        ready[c]=true;render();
      },function(err){dbErr=(err&&err.code)||'error';render();});
    });
  }else{mode='local';lsLoad();try{if(!S.products.length&&!localStorage.getItem('sk-seeded')){FLAT.forEach(function(p){S.products.push({id:p.id,name:p.name,group:p.group,cat:p.cat,unit:p.unit,rate:0,imgId:''});});localStorage.setItem('sk-seeded','1');lsSave();}}catch(e){}COLS.forEach(function(c){ready[c]=true;});}
  render();
}
init();
})();
</script>
